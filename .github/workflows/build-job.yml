# CTR Reload Edition - the build job, shared by build.yml and nightly.yml.
#
# Builds (32-bit, MSVC), runs the self-tests, packages, and - except for pull
# requests - attaches the package to the run. It never writes to the
# repository: the token is read-only here, and the release jobs that may
# write live in the calling workflows.
#
# Input "ref": the branch, tag or commit to build; empty = the commit that
# started the run. Output "artifact": the name of the uploaded package.
#
# This workflow never downloads or uses game data. It only builds and runs
# self-tests that need no disc image, no window and no GPU.

name: Build job

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty = the one that started the run)
        type: string
        required: false
        default: ''
    outputs:
      artifact:
        description: Name of the uploaded package artifact
        value: ${{ jobs.build.outputs.artifact }}
      sha:
        description: The commit that was built
        value: ${{ jobs.build.outputs.sha }}

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.3.296.0
  # Published by LunarG: https://sdk.lunarg.com/sdk/sha/<version>/windows/VulkanSDK-<version>-Installer.exe.txt
  VULKAN_SDK_SHA256: acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b

jobs:
  build:
    runs-on: windows-2022   # the CMake preset requires "Visual Studio 17 2022"
    timeout-minutes: 60
    outputs:
      artifact: ctr-reload-edition-${{ steps.head.outputs.sha }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Name the commit
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python (test suite)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The cache holds only the installed SDK. It is written only by runs
      # on main, dev, tags, nightly and manual runs, never by pull requests.
      - name: Restore Vulkan SDK from cache
        id: vulkan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}

      - name: Install Vulkan SDK (headers and glslangValidator)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:VULKAN_SDK_VERSION
          $exe = "$env:RUNNER_TEMP\VulkanSDK.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK installer SHA-256 mismatch: $hash" }
          & $exe --root "C:\VulkanSDK\$v" --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer failed ($LASTEXITCODE)" }

      - name: Save Vulkan SDK to cache
        if: steps.vulkan-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}

      - name: Point the build at the Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$sdk\Bin\glslangValidator.exe" --version

      - name: Build and self-tests (same command as a local build)
        shell: cmd
        run: build-msvc.bat

      # Output: dist/CTR-Reload-<version without spaces>-<build id>.zip; its
      # top folder has the same name and holds ctr_native.exe (with its .pdb),
      # alphamaker.exe, README.txt, RELEASE-NOTES.txt, LICENSE,
      # THIRD_PARTY_NOTICES.md and the source zip (the list is in package.sh).
      - name: Package
        shell: bash
        env:
          BUILD_DIR: build-msvc-x86
        run: bash tools/package/package.sh

      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctr-reload-edition-${{ steps.head.outputs.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ steps.head.outputs.sha }}
          path: |
            build-msvc-x86/Testing/Temporary/LastTest.log
            dist-build.log
          if-no-files-found: ignore
