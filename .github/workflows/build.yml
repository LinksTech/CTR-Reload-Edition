# CTR Reload Edition - automatic builds.
#
# Every push to main or dev: build (32-bit, MSVC), run the self-tests, package,
# and attach the package to the run as a download.
# Every version tag (v*, e.g. v0.1.0-beta1): the same, plus a GitHub release
# with the package.
#
# This workflow never downloads or uses game data. It only builds and runs
# self-tests that need no disc image, no window and no GPU.

name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.3.296.0

jobs:
  build:
    runs-on: windows-2022   # the CMake preset requires "Visual Studio 17 2022"
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python (test suite)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (headers and glslangValidator)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\VulkanSDK.exe"
          & "$env:RUNNER_TEMP\VulkanSDK.exe" --root "C:\VulkanSDK\$v" --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer failed ($LASTEXITCODE)" }

      - name: Point the build at the Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$sdk\Bin\glslangValidator.exe" --version

      - name: Build and self-tests (same command as a local build)
        shell: cmd
        run: build-msvc.bat

      - name: Package
        shell: bash
        env:
          BAU: build-msvc-x86
        run: bash tools/paket/paket-beta0.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ctr-reload-edition-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.sha }}
          path: |
            build-msvc-x86/Testing/Temporary/LastTest.log
            dist-bau.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ctr-reload-edition-${{ github.sha }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
