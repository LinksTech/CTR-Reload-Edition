# CTR Reload Edition - automatic builds.
#
# Every push to main or dev: build (32-bit, MSVC), run the self-tests, package,
# and attach the package to the run as a download.
# Every version tag (v*, e.g. v0.1.0-beta1): the same, plus a GitHub release
# with exactly two files, ctr_native.exe and alphamaker.exe; GitHub adds the
# source code archives of the tag by itself. The release text comes from
# .github/release-body.txt.
# Every pull request into main or dev: build, self-tests and package check
# only. No package download, no release, no cache writes, read-only token.
#
# The build job is in build-job.yml (shared with nightly.yml).
#
# This workflow never downloads or uses game data. It only builds and runs
# self-tests that need no disc image, no window and no GPU.
#
# Security notes:
# - The token is read-only everywhere; only the release job may write
#   (contents: write), and it never runs for pull requests.
# - There is no pull_request_target trigger: code from a pull request never
#   runs with a writable token or with secrets.
# - Third-party actions are pinned to full commit SHAs (version in the
#   comment); updates are made by hand.
# - The Vulkan SDK installer is pinned by version and SHA-256.

name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A newer push to the same pull request cancels
# the older run; branch and tag runs are never cancelled (each tag is its
# own ref, so tag runs never wait on each other).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The build itself lives in build-job.yml, shared with the nightly build.
  build:
    uses: ./.github/workflows/build-job.yml
    permissions:
      contents: read

  release:
    # Only a version tag, pushed or run by hand - never a pull request.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release text
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/release-body.txt
          sparse-checkout-cone-mode: false
          path: src

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Every release carries exactly these two files, both from this one
      # run: they are taken out of the package that the build job checked,
      # so they are the programs it tested and paired. The exe names stay
      # fixed (the Alpha-Maker looks for the game as ctr_native.exe); the
      # version is in the release title and in the programs, not in the file
      # names. No package zip, no README: GitHub attaches the source code of
      # the tag to every release by itself.
      - name: Collect release files
        id: files
        shell: bash
        run: |
          set -e
          zip=$(ls dist/*.zip)
          [ "$(echo "$zip" | wc -l)" = 1 ] || { echo "expected exactly one package zip"; exit 1; }
          name=$(basename "$zip" .zip)
          id=${name##*-}
          case "$name" in CTR-Reload-?*-?*) ;; *) echo "unexpected package name: $name"; exit 1 ;; esac
          case "$id" in *[!0-9a-f]*|'') echo "unexpected build id: $id"; exit 1 ;; esac
          [ ${#id} = 12 ] || { echo "unexpected build id: $id"; exit 1; }
          mkdir -p out
          unzip -j -o "$zip" "$name/ctr_native.exe" "$name/alphamaker.exe" -d out
          [ -s src/.github/release-body.txt ] || { echo "release text missing"; exit 1; }
          ls -l out
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: CTR Reload Edition ${{ github.ref_name }} (${{ steps.files.outputs.build_id }})
          body_path: src/.github/release-body.txt
          files: |
            out/ctr_native.exe
            out/alphamaker.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false
