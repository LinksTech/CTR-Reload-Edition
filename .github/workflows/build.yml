# CTR Reload Edition - builds of pull requests, and releases by hand.
#
# Nothing here starts by itself on a push: the automatic build of main is
# the nightly (nightly.yml, once a day when main has changed).
#
# Every pull request into main: build, self-tests and package check only.
# No package download, no release, no cache writes, read-only token.
#
# By hand (Actions -> Build -> Run workflow):
# - without "tag": build the chosen branch, run the self-tests, package, and
#   attach the package to the run as a download. No release.
# - with "tag" (a version tag, e.g. v0.8.0 or v0.8.0-beta1): a GitHub release
#   for that tag. If the tag exists, its commit is built; if not, the commit
#   of the chosen branch (run it on main) is built and the release creates
#   the tag on exactly that commit. An existing tag is never moved. The
#   release has exactly five files: the programs ctr_native.exe and
#   ReloadStudio.exe, LICENSE and THIRD_PARTY_NOTICES.md, because the
#   licenses must travel with the programs (GPL-3.0, and the notices of the
#   bundled third-party code), and README.txt, the guide of the package.
#   GitHub adds the source code archives of the tag by itself. The release
#   text comes from .github/release-body.txt, the release title from the
#   version in CMakeLists.txt, both of the built commit. A tag without
#   "beta" or "alpha" in its name is a full release and becomes the latest
#   one; the nightly build never does.
#
# The build job is in build-job.yml (shared with nightly.yml).
#
# This workflow never downloads or uses game data. It only builds and runs
# self-tests that need no disc image, no window and no GPU.
#
# Security notes:
# - The token is read-only everywhere; only the release job may write
#   (contents: write), and it never runs for pull requests.
# - The release job runs only in LinksTech/CTR-Reload-Edition itself and
#   only by hand: a fork builds, but makes no release.
# - There is no pull_request_target trigger: code from a pull request never
#   runs with a writable token or with secrets.
# - Third-party actions are pinned to full commit SHAs (version in the
#   comment); updates are made by hand.
# - The Vulkan SDK installer is pinned by version and SHA-256.

name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version tag to release (e.g. v0.8.0). An existing tag is built as
          it is; a new one is created on the commit of the chosen branch.
          Empty = build only, no release.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One run per ref at a time. A newer push to the same pull request cancels
# the older run; runs by hand are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A run by hand with "tag": is the name a version tag, and does the tag
  # exist? An existing tag is built as it is, a new one from the commit
  # that started the run.
  resolve:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - name: Look up the tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag (v<number>...): $TAG"; exit 1 ;; esac
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "unexpected tag name: $TAG"; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2> err.txt; then
            echo "Tag $TAG exists: its commit is built."
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' err.txt; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a new tag is only made from main (this run: $GITHUB_REF)"; exit 1; }
            echo "Tag $TAG is new: $GITHUB_SHA is built and tagged."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            exit 1
          fi

  # The build itself lives in build-job.yml, shared with the nightly build.
  build:
    needs: resolve
    if: >-
      !cancelled()
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
    uses: ./.github/workflows/build-job.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
    permissions:
      contents: read

  release:
    # Only by hand with "tag", only in this repository - never a pull
    # request, never a fork.
    if: >-
      !cancelled()
      && github.repository == 'LinksTech/CTR-Reload-Edition'
      && github.event_name == 'workflow_dispatch'
      && needs.resolve.result == 'success'
      && needs.build.result == 'success'
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # An existing tag must still be the commit that was built; a new one
      # must still be missing (it is created on the built commit below).
      - name: Check the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.sha }}
          EXISTS: ${{ needs.resolve.outputs.exists }}
        run: |
          set -e
          if [ "$EXISTS" = true ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)
            [ "$sha" = "$BUILT" ] || { echo "tag $RELEASE_TAG is $sha, but $BUILT was built"; exit 1; }
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2> /dev/null; then
              echo "tag $RELEASE_TAG was created during the run - start the run again"; exit 1
            fi
          fi
          echo "Release for $RELEASE_TAG ($BUILT)"

      - name: Check out the release text
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/release-body.txt
            CMakeLists.txt
          sparse-checkout-cone-mode: false
          path: src

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Every release carries exactly these five files, all from this one
      # run: they are taken out of the package that the build job checked,
      # so the programs are the ones it tested and paired, and the texts are
      # the ones packaged with them. LICENSE (GPL-3.0) and
      # THIRD_PARTY_NOTICES.md (the notices of the bundled third-party code)
      # must travel with the programs; README.txt is the guide of the
      # package. The exe names stay fixed (Reload Studio looks for the game
      # as ctr_native.exe); the version is in the release title and in the
      # programs, not in the file names. No package zip: GitHub attaches the
      # source code of the tag to every release by itself.
      - name: Collect release files
        id: files
        shell: bash
        run: |
          set -e
          zip=$(ls dist/*.zip)
          [ "$(echo "$zip" | wc -l)" = 1 ] || { echo "expected exactly one package zip"; exit 1; }
          name=$(basename "$zip" .zip)
          id=${name##*-}
          case "$name" in CTR-Reload-?*-?*) ;; *) echo "unexpected package name: $name"; exit 1 ;; esac
          case "$id" in *[!0-9a-f]*|'') echo "unexpected build id: $id"; exit 1 ;; esac
          [ ${#id} = 12 ] || { echo "unexpected build id: $id"; exit 1; }
          mkdir -p out
          unzip -j -o "$zip" "$name/ctr_native.exe" "$name/ReloadStudio.exe" \
            "$name/LICENSE" "$name/THIRD_PARTY_NOTICES.md" "$name/README.txt" -d out
          for f in ctr_native.exe ReloadStudio.exe LICENSE THIRD_PARTY_NOTICES.md README.txt; do
            [ -s "out/$f" ] || { echo "missing or empty in the package: $f"; exit 1; }
          done
          [ -s src/.github/release-body.txt ] || { echo "release text missing"; exit 1; }
          # The release title carries the version the programs report, from
          # CMakeLists.txt: set(CTR_NATIVE_VERSION "..."). The file has CRLF
          # line ends: the CR goes before sed, or "$" never matches (as in
          # tools/package/package.sh).
          version=$(tr -d '\r' < src/CMakeLists.txt | sed -n 's/^set(CTR_NATIVE_VERSION "\([^"]*\)")$/\1/p')
          [ -n "$version" ] || { echo "version not found in CMakeLists.txt"; exit 1; }
          ls -l out
          echo "build_id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Only used when the tag is new: it is created on the built commit.
          target_commitish: ${{ needs.build.outputs.sha }}
          name: CTR Reload ${{ steps.files.outputs.version }}
          body_path: src/.github/release-body.txt
          files: |
            out/ctr_native.exe
            out/ReloadStudio.exe
            out/LICENSE
            out/THIRD_PARTY_NOTICES.md
            out/README.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') }}
          make_latest: ${{ !(contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha')) }}
          generate_release_notes: false
