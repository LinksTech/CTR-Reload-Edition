# CTR Reload Edition - nightly build of main.
#
# The only automatic build of main. Every day at 21:00 UTC, and by hand (Actions -> Nightly -> Run workflow):
# builds main and updates the one pre-release "nightly-builds" so that it holds
# exactly the four files of every release (see build.yml): the programs
# ctr_native.exe and ReloadStudio.exe, and LICENSE and THIRD_PARTY_NOTICES.md,
# because the licenses must travel with the programs. The tag is moved to the
# new commit and the release is edited in place, never deleted and recreated:
# deleting and recreating a tag of the same name raced with GitHub's delayed
# tag deletion and turned the release into an untagged draft. If main has not
# changed since the last nightly, the run ends after the check and nothing is
# built or updated.
#
# The last built commit is the tag nightly-builds itself: it always points at
# the main commit the nightly was built from.
#
# GitHub starts scheduled runs only from the default branch, so this file has
# to be on main, and main is also what it builds. After 60 days without
# activity in the repository GitHub switches the schedule off; it is switched
# on again in the Actions tab.
#
# Security notes (as in build.yml):
# - The token is read-only everywhere; only the release job may write
#   (contents: write).
# - No secrets, no pull request triggers. The release job uses the gh command
#   of the runner and one pinned action (download-artifact).
# - It runs only in LinksTech/CTR-Reload-Edition itself and only from main:
#   in a fork with Actions switched on, or by hand from another branch,
#   every job is skipped.
# - The build is build-job.yml, the same job as for pull requests and
#   releases. No game data.

name: Nightly

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    # Only in this repository, only from main (a run by hand from another
    # branch is skipped; scheduled runs are always on main), and only by
    # schedule or by hand. The build and release jobs need this one, so
    # they are skipped with it.
    if: >-
      github.repository == 'LinksTech/CTR-Reload-Edition'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.compare.outputs.build }}
      sha: ${{ steps.compare.outputs.sha }}
      last: ${{ steps.compare.outputs.last }}
    steps:
      - name: Has main changed since the last nightly?
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          case "$sha" in *[!0-9a-f]*|'') echo "unexpected main commit: $sha"; exit 1 ;; esac
          [ ${#sha} = 40 ] || { echo "unexpected main commit: $sha"; exit 1; }
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly-builds" -q '.object.type + " " + .object.sha' 2> err.txt); then
            type=${ref%% *}
            last=${ref#* }
            [ "$type" = commit ] || { echo "tag nightly-builds is not a plain commit tag: $ref"; exit 1; }
          elif grep -q 'HTTP 404' err.txt; then
            last=''
          else
            cat err.txt
            exit 1
          fi
          echo "main:           $sha"
          echo "last nightly:   ${last:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$last" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last nightly - nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-job.yml
    with:
      # The exact commit the check saw, not the branch: a push to main during
      # the run does not change what this nightly is.
      ref: ${{ needs.check.outputs.sha }}
    permissions:
      contents: read

  release:
    needs: [check, build]
    # The one job that writes: the repository test once more, on its own.
    if: >-
      github.repository == 'LinksTech/CTR-Reload-Edition'
      && needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # The same four files as every release (the two programs, LICENSE and
      # THIRD_PARTY_NOTICES.md), taken out of the package the build job
      # checked. The build ID must be the main commit, clean.
      - name: Collect nightly files
        id: files
        shell: bash
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -e
          zip=$(ls dist/*.zip)
          [ "$(echo "$zip" | wc -l)" = 1 ] || { echo "expected exactly one package zip"; exit 1; }
          name=$(basename "$zip" .zip)
          id=${name##*-}
          case "$name" in CTR-Reload-?*-?*) ;; *) echo "unexpected package name: $name"; exit 1 ;; esac
          [ "$id" = "${SHA:0:12}" ] || { echo "build id $id is not the main commit ${SHA:0:12}"; exit 1; }
          mkdir -p out
          unzip -j -o "$zip" "$name/ctr_native.exe" "$name/ReloadStudio.exe" \
            "$name/LICENSE" "$name/THIRD_PARTY_NOTICES.md" -d out
          for f in ctr_native.exe ReloadStudio.exe LICENSE THIRD_PARTY_NOTICES.md; do
            [ -s "out/$f" ] || { echo "missing or empty in the package: $f"; exit 1; }
          done
          ls -l out
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

      # Nothing but the four nightly files is in out/ (so nothing from a
      # creator kit or anything else can be published beside them).
      - name: Exactly the nightly files
        shell: bash
        run: |
          set -e
          [ "$(LC_ALL=C ls -A out | tr '\n' ' ')" = "LICENSE ReloadStudio.exe THIRD_PARTY_NOTICES.md ctr_native.exe " ] || { echo "out/ does not hold exactly the nightly files:"; ls -lA out; exit 1; }

      - name: Write the description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          LAST: ${{ needs.check.outputs.last }}
        run: |
          set -e
          base=$LAST
          since='the last nightly build'
          if [ -z "$base" ]; then
            # The first nightly: everything since the newest version tag.
            base=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" -q '.[].ref' | sed 's|^refs/tags/||' | sort -V | tail -n 1)
            since=${base:-the start}
          fi
          {
            echo '> [!WARNING]'
            echo '> Untested build, straight from main: it may be broken. For a tested version use the newest release that is not a nightly.'
            echo
            echo "Changes since $since:"
            echo
            if [ -n "$base" ]; then
              gh api "repos/$GITHUB_REPOSITORY/compare/$base...$SHA" \
                -q '.commits | reverse | .[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"'
            fi
          } > body.md
          cat body.md

      # The release and its tag are MOVED, never deleted. Deleting the tag and
      # creating a release with the same tag name seconds later loses a race:
      # GitHub processes the tag deletion late, and a release whose tag "was
      # deleted" becomes an untagged draft (2026-10-03 and 2026-10-11).
      - name: Update the nightly release in place
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          ID: ${{ steps.files.outputs.build_id }}
        run: |
          set -e
          repo=$GITHUB_REPOSITORY
          title="Nightly build — $(date -u +%Y-%m-%d) ($ID)"
          files="out/ctr_native.exe out/ReloadStudio.exe out/LICENSE out/THIRD_PARTY_NOTICES.md"
          # 1. The tag: moved to the new commit if it exists, made if not.
          if gh api "repos/$repo/git/ref/tags/nightly-builds" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$repo/git/refs/tags/nightly-builds" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/tags/nightly-builds -f sha="$SHA" > /dev/null
          fi
          # 2. The release: edited in place if it exists, made on the existing tag if not.
          if gh release view nightly-builds -R "$repo" > /dev/null 2>&1; then
            gh release upload nightly-builds $files -R "$repo" --clobber
            gh release edit nightly-builds -R "$repo" --title "$title" --notes-file body.md \
              --draft=false --prerelease --latest=false
          else
            gh release create nightly-builds $files -R "$repo" --verify-tag \
              --title "$title" --notes-file body.md --prerelease --latest=false
          fi
          # 3. Exactly the four files: any other asset is removed.
          for name in $(gh release view nightly-builds -R "$repo" --json assets -q '.assets[].name'); do
            case "$name" in
              ctr_native.exe|ReloadStudio.exe|LICENSE|THIRD_PARTY_NOTICES.md) ;;
              *) gh release delete-asset nightly-builds "$name" -R "$repo" -y ;;
            esac
          done

      # Checked for two minutes, because the race above showed only after
      # seconds. A release that turned into a draft anyway is put back once;
      # if it is still wrong after that, the run fails and says so.
      - name: Check the nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -e
          repo=$GITHUB_REPOSITORY
          healed=0
          for i in 1 2 3 4 5 6; do
            sleep 20
            state=$(gh release view nightly-builds -R "$repo" --json isDraft,isPrerelease,tagName \
              -q '"\(.isDraft) \(.isPrerelease) \(.tagName)"')
            tag=$(gh api "repos/$repo/git/ref/tags/nightly-builds" -q .object.sha)
            echo "check $i: draft/prerelease/tag = $state, tag -> $tag"
            if [ "$state" != "false true nightly-builds" ] || [ "$tag" != "$SHA" ]; then
              [ "$healed" = 0 ] || { echo "nightly release still wrong after one repair"; exit 1; }
              gh release edit nightly-builds -R "$repo" --draft=false --prerelease --latest=false --verify-tag
              healed=1
            fi
          done
          gh release view nightly-builds -R "$repo" --json name,isPrerelease,assets \
            -q '"\(.name) prerelease=\(.isPrerelease) " + ([.assets[].name] | join(" "))'
