# CTR Reload Edition - content guard.
#
# Every push (any branch or tag) and every pull request: tools/content_guard.py
# checks the whole history of the checked-out commit - the pushed commit, or
# for a pull request the merge commit into its base - and fails on game data
# file types, on 3D model, audio, picture and archive file types and on binary
# files larger than 1 MB in any commit. The only exceptions are the SDL files
# that the script lists by path and blob id. The rules are in the script.
# Before that, the script's self-test (--self-test) checks the rules against
# paths and contents made up in the script, so a weakened rule fails the run.
#
# One check name, content-guard, for push and pull request: both check the
# whole history, so a later commit that deletes a file never makes it pass,
# and a direct push gets the same check as a pull request.
#
# This check comes after the fact: the commits are already on GitHub when it
# runs. tools/git-hooks/pre-push runs the same rules (and more) before anything
# leaves the machine; its self-test (--self-test) runs here as well, so a step
# of the hook that no longer refuses on an error fails the run.
#
# Security notes (as in build.yml):
# - Read-only token, no secrets, no pull_request_target trigger.
# - The checkout keeps no credentials. The script only reads git objects; it
#   builds and runs nothing from the checked commits. The hook's self-test
#   writes made-up blobs into a repository of its own in a temporary folder.
# - A pull request runs this file, the script and the hook as the pull
#   request has them, so a pull request that changes any of them needs a
#   careful review.
# - No concurrency group: a cancelled run would leave commits unchecked.
# - The one action is pinned to its full commit SHA (as in build.yml).

name: Guard

on:
  push:
  pull_request:
    # "edited" too: a pull request moved to another base branch is checked
    # again against its new base.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  content-guard:
    name: content-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A push that deletes a branch or tag has no commit: every step is
      # skipped and the job passes.
      - name: Check out with the whole history
        if: github.event.deleted != true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test of the content guard
        if: github.event.deleted != true
        run: python3 tools/content_guard.py --self-test

      - name: Self-test of the pre-push hook
        if: github.event.deleted != true
        run: sh tools/git-hooks/pre-push --self-test

      - name: Check every commit in the history
        if: github.event.deleted != true
        run: python3 tools/content_guard.py --github
