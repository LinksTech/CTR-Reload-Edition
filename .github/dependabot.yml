# Dependabot: keeps the SHA-pinned GitHub Actions in .github/workflows up to
# date. It opens one grouped pull request per week against the default
# branch; the pin and the version comment are updated together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
